[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commercelens-ai"
version = "0.1.0"
description = "Enterprise-grade Brazilian E-Commerce Analytics, ML Delivery-Risk Prediction, and Evidence-Grounded AI Copilot"
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = { text = "MIT" }
authors = [
    { name = "CommerceLens Analytics Team" }
]
keywords = [
    "data-analytics",
    "ecommerce",
    "postgresql",
    "powerbi",
    "machine-learning",
    "delivery-risk",
    "llm",
    "streamlit",
    "olist"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "sqlalchemy>=2.0.25,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "plotly>=5.19.0,<6.0.0",
    "streamlit>=1.32.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "ruff>=0.3.0,<1.0.0",
    "black>=24.2.0,<25.0.0",
    "ipykernel>=6.29.0,<7.0.0",
]
ml = [
    "catboost>=1.2.0,<2.0.0",
    "shap>=0.45.0,<1.0.0",
    "imbalanced-learn>=0.12.0,<1.0.0",
]
llm = [
    "google-generativeai>=0.4.0,<1.0.0",
]
all = [
    "commercelens-ai[dev,ml,llm]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
markers = [
    "smoke: Quick sanity tests for repo verification and structural integrity",
    "unit: Isolated unit tests for transformation functions and metrics",
    "integration: Integration tests requiring database or file access",
    "slow: Tests with long runtimes such as ML model training",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by formatting / black style)
]
